# קובץ ההגדרות לבדיקות עם מסד נתונים בזיכרון. 
spring.application.name=doc-extractor
server.port=8081

spring.datasource.url=jdbc:h2:mem:docdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

gemini.model=gemini-3.5-flash-lite
gemini.api.key=dummy-test-key
